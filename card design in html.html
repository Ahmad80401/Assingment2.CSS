<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Static Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 300px;
            height: 400px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            box-shadow: 5px 5px 18px rgba(0, 0, 0, 0.25);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .top-text {
            padding: 15px;
        }

        .top-text .name {
            font-size: 22px;
            font-weight: 600;
            color: #202020;
        }

        .top-text .role {
            font-size: 18px;
            color: #e74c3c;
            font-weight: 500;
            margin-top: 5px;
        }

        .description {
            padding: 0 15px 15px 15px;
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            text-align: justify;
            flex-grow: 1;
        }

        .arrow-btn {
            margin: 0 15px 15px 0;
            align-self: flex-end;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color:black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .arrow-btn:hover {
            background: white;
            transform: translateX(5px);
        }

        @media screen and (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Card 1 -->
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHQda95eb5HauBRDox9pl4rU44l_KgUth1sg&s" alt="Profile 1">
            <div class="top-text">
                <div class="role"> Developer</div>
            </div>
            <div class="description">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit.
            </div>
            <a href="#" class="arrow-btn">→</a>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://www.wikihow.com/images/thumb/9/94/Become-a-Fashion-Designer-Step-14.jpeg/v4-460px-Become-a-Fashion-Designer-Step-14.jpeg" alt="Profile 2">
            <div class="top-text">
                <div class="role"> Designer</div>
            </div>
            <div class="description">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. </div>
            <a href="#" class="arrow-btn">→</a>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://miro.medium.com/0*qKaI6a9c0mZi5P1P.jpeg" alt="Profile 3">
            <div class="top-text">
                <div class="role">Editor</div>
            </div>
            <div class="description">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. </div>
            <a href="#" class="arrow-btn">→</a> 
            </div>
    <div style=" background-color:aquamarine;">
    <h1>Responsive Card Design In HTML And CSS</h1>
    
    </div>

</body>

</html>
